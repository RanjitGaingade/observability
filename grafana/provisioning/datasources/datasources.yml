apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
     derivedFields:
        - name: TraceID
          matcherRegex: 'trace_id"\s*:\s*"([0-9a-f]{32})"'
          url: '$${__value.raw}'
          datasourceUid: jaeger
          urlDisplayLabel: Open trace in Jaeger
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
